name: CI - Frontend Service

on:
  push:
    branches: [main]
    paths:
      - 'splitsettle-frontend/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: splitsettle-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/dilipmaurya1586/splitsettle-frontend:latest .
          docker push ghcr.io/dilipmaurya1586/splitsettle-frontend:latest

  deploy:
    needs: build
    runs-on: self-hosted
    defaults:
      run:
        working-directory: k8s
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f frontend.yaml
          kubectl rollout restart deployment splitsettle-frontend