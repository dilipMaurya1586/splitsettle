version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres-users:
    image: postgres:16
    environment:
      POSTGRES_DB: splitsettle_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pg_users_data:/var/lib/postgresql/data

  postgres-groups:
    image: postgres:16
    environment:
      POSTGRES_DB: splitsettle_groups
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pg_groups_data:/var/lib/postgresql/data

  postgres-expenses:
    image: postgres:16
    environment:
      POSTGRES_DB: splitsettle_expenses
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - pg_expenses_data:/var/lib/postgresql/data

  postgres-settlements:
    image: postgres:16
    environment:
      POSTGRES_DB: splitsettle_settlements
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - pg_settlements_data:/var/lib/postgresql/data

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8762:8761"

  user-service:
    build: ./user-service
    depends_on:
      - eureka-server
      - postgres-users
      - kafka
    environment:
      DB_HOST: postgres-users
      DB_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URI: http://eureka-server:8761/eureka
    ports:
      - "8081:8081"

  group-service:
    build: ./group-service
    depends_on:
      - eureka-server
      - postgres-groups
      - kafka
    environment:
      DB_HOST: postgres-groups
      DB_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URI: http://eureka-server:8761/eureka
    ports:
      - "8082:8082"

  expense-service:
    build: ./expense-service
    depends_on:
      - eureka-server
      - postgres-expenses
      - kafka
    environment:
      DB_HOST: postgres-expenses
      DB_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URI: http://eureka-server:8761/eureka
    ports:
      - "8083:8083"

  settlement-service:
    build: ./settlement-service
    depends_on:
      - eureka-server
      - postgres-settlements
      - kafka
    environment:
      DB_HOST: postgres-settlements
      DB_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URI: http://eureka-server:8761/eureka
    ports:
      - "8084:8084"

  ai-service:
    build: ./ai-service
    depends_on:
      - eureka-server
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EUREKA_URI: http://eureka-server:8761/eureka
    ports:
      - "8085:8085"

  notification-service:
    build: ./notification-service
    depends_on:
      - eureka-server
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URI: http://eureka-server:8761/eureka
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "8086:8086"

  api-gateway:
    build: ./api-gateway
    depends_on:
      - eureka-server
      - user-service
      - group-service
      - expense-service
      - settlement-service
      - ai-service
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka
    ports:
      - "8080:8080"

volumes:
  pg_users_data:
  pg_groups_data:
  pg_expenses_data:
  pg_settlements_data:
