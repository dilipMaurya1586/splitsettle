apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: settlement-service
  template:
    metadata:
      labels:
        app: settlement-service
    spec:
      containers:
        - name: settlement-service
          image: ghcr.io/dilipmaurya1586/settlement-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-service:8761/eureka"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://ep-young-sun-ay45lka5-pooler.c-5.us-east-2.aws.neon.tech:5432/settlement_db?sslmode=require&options=-c%20timezone=Asia/Kolkata"
            - name: SPRING_DATASOURCE_USERNAME
              value: "neondb_owner"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "npg_JLfWQdeu53wZ"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: settlement-service
spec:
  selector:
    app: settlement-service
  ports:
    - port: 8084
      targetPort: 8084
  type: ClusterIP